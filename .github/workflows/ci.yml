name: CI

# Read-only and offline by design.
#
# This workflow NEVER receives Azure credentials. A pull request from a fork
# can run it safely because nothing here can reach Azure, and nothing prints
# Terraform state or plan contents.
#
# Live integration tests need a real deployment, a real tenant, and a real
# human identity. They cannot run here and are not pretended to.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Policy contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      # These are the security invariants. A break here means the
      # architecture's core guarantee has regressed, so this job gates
      # everything else.
      - name: Policy invariants and request allowlist
        run: uv run pytest tests/contract -v

      - name: Client unit tests
        run: uv run pytest tests/unit -v

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy examples/python/map_client

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false

      - name: Format check
        run: terraform -chdir=infra fmt -check -recursive

      # -backend=false: no state backend is contacted and no credentials are
      # needed. Validation is a schema check, not a plan.
      - name: Init (no backend)
        run: terraform -chdir=infra init -backend=false -input=false

      - name: Validate
        run: terraform -chdir=infra validate

      # The lockfile is what makes the provider-behaviour evidence in
      # docs/platform-validation.md reproducible. An unlocked provider could
      # silently change what lands in state.
      - name: Verify provider lockfile is committed
        run: |
          if [ ! -f infra/.terraform.lock.hcl ]; then
            echo "::error::infra/.terraform.lock.hcl is missing. Provider versions must be pinned."
            exit 1
          fi

  extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/vscode
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/vscode/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npx tsc -p ./ --noEmit

  diagrams:
    name: Architecture diagrams
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The Mermaid sources are the architecture contract. A diagram that no
      # longer parses is a broken contract, not a cosmetic issue.
      - name: Validate Mermaid sources
        run: |
          for file in docs/architecture/*.mmd; do
            echo "Validating $file"
            npx --yes @mermaid-js/mermaid-cli@11.4.2 -i "$file" -o /tmp/out.png
          done

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # This repository has no runtime secrets by design, so any key-shaped
      # string in Terraform is a design regression worth failing on.
      #
      # Comment lines are stripped first: these modules legitimately EXPLAIN
      # in prose why they avoid reading keys ("AzureRM skips AccountsListKeys
      # when local auth is disabled"), and matching that prose would be a
      # false positive.
      - name: Assert no key material in Terraform
        run: |
          matches=$(find infra -name '*.tf' -print0 \
            | xargs -0 grep -InE '(primary_access_key|secondary_access_key|primary_shared_key|listKeys|ListSecrets)' \
            | grep -vE ':[0-9]+:\s*#' || true)
          if [ -n "$matches" ]; then
            echo "::error::Terraform references key material. Local auth is disabled; no key should be read."
            echo "$matches"
            exit 1
          fi
          echo "No key material referenced outside comments."

      - name: Assert no state or plan files are committed
        run: |
          if git ls-files | grep -E '\.(tfstate|tfplan)(\..*)?$'; then
            echo "::error::Terraform state or plan is committed. These can contain provider-computed values."
            exit 1
          fi
          echo "No state or plan files tracked."
